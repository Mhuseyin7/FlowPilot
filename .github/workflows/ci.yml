name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go mod tidy
      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          cat test-output.log >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package.json}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
